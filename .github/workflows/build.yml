
name: Build UEFI GCD MMIO audit

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - '*.inf'
      - 'README.md'
      - '.github/workflows/build.yml'
  push:
    branches: [ main, stage-2b-gcd-mmio-audit ]
    paths:
      - 'src/**'
      - '*.inf'
      - 'README.md'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      # Install only packages not already present on the runner.
      - name: Install missing EDK II dependencies
        shell: bash
        run: |
          packages=(
            build-essential gcc g++ binutils make
            uuid-dev nasm acpica-tools
            python3 python3-pip python3-venv git
          )

          missing=()

          for pkg in "${packages[@]}"; do
            if ! dpkg-query -W -f='${db:Status-Status}' \
              "$pkg" 2>/dev/null | grep -qx installed; then
              missing+=("$pkg")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Installing missing packages: ${missing[*]}"
            sudo apt-get update
            sudo apt-get install -y "${missing[@]}"
          else
            echo "All required packages are already installed."
          fi

      - name: Verify compiler and tools
        run: |
          gcc --version
          g++ --version
          make --version
          nasm -v
          iasl -v
          x86_64-linux-gnu-gcc --version

      # Restore the latest available EDK2 source cache.
      - name: Restore EDK2 bootstrap cache
        uses: actions/cache/restore@v4
        with:
          path: edk2
          key: edk2-Linux-X64-bootstrap

      # First-ever run: perform a normal checkout.
      - name: Checkout EDK II
        if: steps.edk2-cache.outputs.cache-matched-key == ''
        uses: actions/checkout@v4
        with:
          repository: tianocore/edk2
          ref: master
          path: edk2
          submodules: recursive
          fetch-depth: 1

      # Subsequent runs: update the cached clone instead of cloning again.
      - name: Refresh cached EDK II checkout
        if: steps.edk2-cache.outputs.cache-matched-key != ''
        working-directory: edk2
        run: |
          git fetch --depth=1 origin master
          git checkout --detach FETCH_HEAD

          git submodule sync --recursive
          git submodule update --init --recursive --depth 1

      - name: Record EDK2 revision
        id: edk2-revision
        run: |
          SHA="$(git -C edk2 rev-parse HEAD)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Using EDK2 revision: $SHA"

      - name: Stage application in EDK II workspace
        run: |
          mkdir -p edk2/GeForceBar1Uefi/src
          cp GeForceBar1Uefi.inf edk2/GeForceBar1Uefi/
          cp src/GeForceBar1Uefi.c edk2/GeForceBar1Uefi/src/

      - name: Register application in platform DSC
        working-directory: edk2
        run: |
          cat >> MdeModulePkg/MdeModulePkg.dsc <<'EOF'

          [Components.X64]
            GeForceBar1Uefi/GeForceBar1Uefi.inf
          EOF

      - name: Build EDK II BaseTools and application
        working-directory: edk2
        run: |
          # Cached BaseTools binaries are reused where possible.
          make -C BaseTools

          source edksetup.sh

          echo "=== Available GCC toolchain definitions ==="
          grep -nE 'GCC(_X64|_IA32)?_' Conf/tools_def.txt | head -30

          export GCC_X64_PREFIX=x86_64-linux-gnu-

          build -a X64 -t GCC -b RELEASE \
            -p MdeModulePkg/MdeModulePkg.dsc \
            -m GeForceBar1Uefi/GeForceBar1Uefi.inf

      - name: Collect EFI application
        run: |
          mkdir -p dist
          EFI_FILE="$(find edk2/Build -type f -name GeForceBar1Uefi.efi -print -quit)"
          test -n "$EFI_FILE"
          cp "$EFI_FILE" dist/GeForceBar1Uefi.efi
          sha256sum dist/GeForceBar1Uefi.efi | tee dist/SHA256SUMS
          file dist/GeForceBar1Uefi.efi

      - name: Upload EFI scanner
        uses: actions/upload-artifact@v4
        with:
          name: GeForceBar1Uefi-gcd-mmio-audit-x64
          path: dist/
          if-no-files-found: error

      # Remove temporary project modifications and build products.
      # Keep EDK2 source, submodules and compiled BaseTools.
      - name: Prepare EDK2 cache
        if: always()
        run: |
          if [ -d edk2/.git ]; then
            git -C edk2 checkout -- MdeModulePkg/MdeModulePkg.dsc || true
            rm -rf edk2/GeForceBar1Uefi
            rm -rf edk2/Build
          fi

      # Save under the exact EDK2 revision so future runs can restore it.
      - name: Save EDK2 bootstrap cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: edk2
          key: edk2-Linux-X64-bootstrap
